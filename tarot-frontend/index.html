<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🔮 塔罗牌占卜</title>
    <style>
        :root {
            --bg: #0a0a1a; --card-bg: #1a1040; --gold: #d4a843; --gold-light: #f0d68a;
            --purple: #7b5ea7; --purple-light: #a78fc7; --red: #c0392b;
            --text: #e0d8f0; --text-dim: #8a80a0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Microsoft YaHei', 'PingFang SC', serif;
            min-height: 100vh; overflow-x: hidden;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        #starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .app-container { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 20px 16px; }
        .header { text-align: center; padding: 30px 0 10px; }
        .header h1 {
            font-size: clamp(28px, 7vw, 44px);
            background: linear-gradient(180deg, #f0d68a 0%, #d4a843 50%, #8b6914 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: 6px; margin-bottom: 6px;
        }
        .header .subtitle { color: var(--text-dim); font-size: 14px; letter-spacing: 3px; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Config Panel */
        .config-panel {
            background: rgba(20, 15, 50, 0.85); border: 1px solid rgba(212, 168, 67, 0.2);
            border-radius: 16px; padding: 28px 20px; backdrop-filter: blur(10px);
        }
        .config-panel h2 { text-align: center; color: var(--gold); font-size: 20px; letter-spacing: 3px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--gold-light); margin-bottom: 8px; font-size: 14px; letter-spacing: 1px; }
        .form-group textarea {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid rgba(212,168,67,0.3); background: rgba(10,8,30,0.8);
            color: var(--text); font-size: 14px; min-height: 60px; font-family: inherit;
            outline: none; resize: vertical;
        }
        .form-group textarea:focus { border-color: var(--gold); }
        .spread-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        @media (max-width: 400px) { .spread-options { grid-template-columns: 1fr; } }
        .spread-option {
            padding: 12px; border-radius: 10px; border: 1.5px solid rgba(212,168,67,0.2);
            background: rgba(20,15,50,0.6); cursor: pointer; transition: all 0.3s; text-align: center;
        }
        .spread-option:hover, .spread-option.selected {
            border-color: var(--gold); background: rgba(212,168,67,0.12);
        }
        .spread-option .spread-name { color: var(--gold-light); font-weight: bold; font-size: 13px; letter-spacing: 1px; }
        .spread-option .spread-desc { color: var(--text-dim); font-size: 11px; margin-top: 4px; }
        .btn {
            display: block; width: 100%; padding: 14px; border: none; border-radius: 25px;
            background: linear-gradient(135deg, #5a3e85, #8b6914); color: var(--gold-light);
            font-size: 17px; font-weight: bold; letter-spacing: 5px; cursor: pointer;
            transition: all 0.3s; text-align: center;
        }
        .btn:hover { box-shadow: 0 0 25px rgba(212,168,67,0.35); transform: translateY(-1px); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; pointer-events: none; }

        /* Draw Area */
        .draw-instruction {
            color: var(--gold-light); font-size: 17px; letter-spacing: 2px;
            text-align: center; margin-bottom: 20px; animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
        .cards-grid {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 16px; padding: 10px; perspective: 1000px;
        }
        .tarot-card {
            width: 110px; height: 170px; position: relative; cursor: pointer;
            transition: transform 0.4s ease; transform-style: preserve-3d;
        }
        .tarot-card:hover { transform: translateY(-6px); }
        .tarot-card.flipped { transform: rotateY(180deg); }
        @media (min-width: 500px) { .tarot-card { width: 130px; height: 200px; } }
        .card-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 10px; backface-visibility: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .card-back {
            background: linear-gradient(135deg, #1a1040, #2d1050, #1a1040);
            border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center;
            z-index: 2;
        }
        .card-back-inner { text-align: center; }
        .card-back-inner .star-icon { font-size: 30px; color: var(--gold); }
        .card-back-inner .moon-text { font-size: 10px; color: var(--purple-light); letter-spacing: 3px; }
        .card-front {
            background: linear-gradient(180deg, #f5f0e8, #e8dcc8);
            border: 2px solid #8b6914; transform: rotateY(180deg);
            padding: 0; display: flex; flex-direction: column; align-items: center;
            overflow: hidden; position: relative;
        }
        .card-front.reversed-card { transform: rotateY(180deg) rotateZ(180deg); }
        .card-front img {
            width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0;
            border-radius: 8px;
        }
        .card-front .card-overlay {
            position: relative; z-index: 1; padding: 10px 8px;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(245,240,232,0.85); border-radius: 8px;
            width: 100%; box-sizing: border-box;
        }
        .card-type-badge { font-size: 9px; background: var(--purple); color: #fff; padding: 1px 8px; border-radius: 8px; letter-spacing: 1px; }
        .card-front .card-name { color: #2a1050; font-size: 14px; font-weight: bold; margin: 6px 0; letter-spacing: 1px; text-align: center; line-height: 1.2; }
        .card-front .card-element { font-size: 9px; color: #6a5090; }
        .card-front .card-keywords { font-size: 8px; color: #8a6a30; text-align: center; margin-top: 4px; line-height: 1.4; }
        .card-position-label { position: absolute; bottom: 6px; font-size: 9px; color: var(--purple); letter-spacing: 1px; }
        .reversed-badge { position: absolute; top: 4px; right: 6px; background: var(--red); color: #fff; font-size: 8px; padding: 1px 5px; border-radius: 5px; }

        /* Result */
        .result-panel { max-width: 750px; margin: 0 auto; }
        .result-header { text-align: center; margin-bottom: 20px; }
        .result-header h2 { color: var(--gold); font-size: 20px; letter-spacing: 3px; }
        .result-header .ai-badge {
            display: inline-block; background: linear-gradient(135deg, #00d4aa, #0077cc); color: #fff;
            padding: 4px 12px; border-radius: 15px; font-size: 11px; letter-spacing: 1px;
        }
        .result-cards-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 24px; }
        .result-mini-card {
            width: 80px; height: 120px; perspective: 600px; cursor: pointer;
            transition: transform 0.3s;
        }
        .result-mini-card:hover { transform: translateY(-4px); }
        .result-mini-card .mini-inner {
            width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d;
            position: relative;
        }
        .result-mini-card.played .mini-inner { transform: rotateY(180deg); }
        .mini-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 8px; backface-visibility: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }
        .mini-back {
            background: linear-gradient(135deg, #1a1040, #2d1050); border: 1.5px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
        }
        .mini-back span { font-size: 20px; }
        .mini-front {
            background: linear-gradient(180deg, #f5f0e8, #e8dcc8); border: 1.5px solid #8b6914;
            transform: rotateY(180deg); padding: 6px; text-align: center;
            display: flex; flex-direction: column; justify-content: center;
        }
        .mini-front .mini-name { font-size: 11px; color: #2a1050; font-weight: bold; line-height: 1.2; }
        .mini-front .mini-pos { font-size: 9px; color: #7b5ea7; margin-top: 2px; }

        /* Reading Detail */
        .reading-detail {
            background: rgba(20,15,50,0.85); border: 1px solid rgba(212,168,67,0.2);
            border-radius: 16px; padding: 20px; backdrop-filter: blur(10px);
        }
        .reading-detail h3 { color: var(--gold); text-align: center; letter-spacing: 3px; margin-bottom: 16px; font-size: 18px; }
        .card-interp {
            background: rgba(10,8,30,0.6); border-radius: 12px; padding: 14px; margin-bottom: 12px;
            border-left: 3px solid var(--gold);
        }
        .card-interp-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .card-interp-header .card-title { font-size: 15px; color: var(--gold-light); font-weight: bold; letter-spacing: 1px; }
        .card-interp-header .pos-tag { background: var(--purple); color: #fff; padding: 2px 10px; border-radius: 10px; font-size: 11px; }
        .card-interp-header .rev-tag { background: var(--red); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .card-interp-summary { color: var(--text); font-size: 14px; font-weight: bold; margin-bottom: 8px; line-height: 1.6; }
        .interp-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        @media (max-width: 500px) { .interp-grid { grid-template-columns: 1fr; } }
        .interp-item { background: rgba(123,94,167,0.1); border-radius: 6px; padding: 8px; font-size: 12px; color: var(--text-dim); }
        .interp-item strong { color: var(--gold-light); }
        .overall-reading {
            background: rgba(212,168,67,0.08); border: 1px solid rgba(212,168,67,0.25);
            border-radius: 14px; padding: 18px; margin-top: 16px; line-height: 1.8; font-size: 14px;
        }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn-secondary {
            flex: 1; padding: 12px; border: 1.5px solid var(--gold);
            border-radius: 25px; background: transparent; color: var(--gold);
            font-size: 14px; letter-spacing: 3px; cursor: pointer; text-align: center;
        }
        .btn-secondary:hover { background: rgba(212,168,67,0.1); }
        #modeIndicator {
            text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 8px;
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="app-container">
        <div class="header">
            <h1>🔮 塔罗占卜</h1>
            <div class="subtitle">── 倾听你内心的声音 ──</div>
        </div>

        <!-- Step 1: Config -->
        <div class="step active" id="stepConfig">
            <div class="config-panel">
                <h2>✨ 开始你的塔罗之旅</h2>
                <div class="form-group">
                    <label>📝 你想问什么？（选填）</label>
                    <textarea id="questionInput" placeholder="默想你的问题，或留空让宇宙给你指引..."></textarea>
                </div>
                <div class="form-group">
                    <label>🃏 选择牌阵</label>
                    <div class="spread-options" id="spreadOptions"></div>
                </div>
                <button class="btn" onclick="startReading()">✦ 开始抽牌 ✦</button>
                <div id="modeIndicator"></div>
            </div>
        </div>

        <!-- Step 2: Draw -->
        <div class="step" id="stepDraw">
            <div class="draw-instruction" id="drawInstruction">🃏 点击卡片抽取塔罗牌</div>
            <div class="cards-grid" id="cardsGrid"></div>
            <div class="btn-row" style="max-width:300px;margin:20px auto 0;" id="drawActions" style="display:none;">
                <button class="btn-secondary" onclick="revealAll()">✨ 全部翻开</button>
                <button class="btn" onclick="getReading()" style="flex:1;">🔮 查看解读</button>
            </div>
        </div>

        <!-- Step 3: Result -->
        <div class="step" id="stepResult">
            <div class="result-panel">
                <div class="result-header">
                    <h2 id="resultTitle"></h2>
                    <div style="margin-top:6px;" id="resultInfo"></div>
                </div>
                <div class="result-cards-row" id="resultCards"></div>
                <div class="reading-detail" id="readingDetail"></div>
                <div class="btn-row">
                    <button class="btn-secondary" onclick="resetApp()">🔄 重新占卜</button>
                    <button class="btn" onclick="shareReading()" style="flex:1;">📋 复制结果</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    // ==================== 星空背景 ====================
    const sc = document.getElementById('starfield'), sctx = sc.getContext('2d');
    let stars = [];
    function initStars() {
        sc.width = innerWidth; sc.height = innerHeight;
        stars = Array.from({length: Math.floor(sc.width*sc.height/3500)}, () => ({
            x: Math.random()*sc.width, y: Math.random()*sc.height,
            r: Math.random()*1.5+0.3, a: Math.random()*Math.PI*2,
            s: Math.random()*0.015+0.005, o: Math.random()*0.5+0.3
        }));
    }
    function drawStars() {
        sctx.clearRect(0,0,sc.width,sc.height);
        for (const s of stars) {
            s.a += s.s;
            const alpha = Math.max(0.1, s.o + Math.sin(s.a)*0.3);
            sctx.beginPath(); sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            sctx.fillStyle = `rgba(255,255,255,${alpha})`; sctx.fill();
        }
        requestAnimationFrame(drawStars);
    }
    initStars(); drawStars();
    window.addEventListener('resize', initStars);

    // ==================== 完整 78 张塔罗牌数据 ====================
    const MAJOR = [
        {n:"愚者",en:"The Fool",e:"风",kw:["开始","冒险","天真","自由"],
         u:{s:"新的开始，一段未知的旅程即将展开，保持开放的心态迎接一切可能。",l:"轻松愉快的恋情萌芽，不要设限。",c:"新的工作机会或方向，勇敢尝试。",f:"意外之喜，把握当下的机会。"},
         r:{s:"鲁莽行事，缺乏考虑，可能错过良机。停下来重新评估再前进。",l:"冲动的情感决定需冷静。",c:"贸然跳槽有风险。",f:"冒险投资需三思。"}},
        {n:"魔术师",en:"The Magician",e:"风",kw:["创造","能力","意志","自信"],
         u:{s:"你拥有创造奇迹的能力，万事俱备只欠行动。",l:"主动出击的好时机。",c:"专注与技能将获认可。",f:"善用资源和能力，财运亨通。"},
         r:{s:"能力被滥用或未善用，缺乏行动力或方向。",l:"花言巧语需警惕。",c:"才华被埋没。",f:"投资需谨慎。"}},
        {n:"女祭司",en:"The High Priestess",e:"水",kw:["直觉","智慧","神秘","内省"],

         r:{s:"忽略内心声音，被表面信息迷惑。",l:"隐藏的情感可能浮现。",c:"信息不透明。",f:"潜在财务问题需关注。"}},
        {n:"皇后",en:"The Empress",e:"土",kw:["丰收","母性","美","自然"],

         r:{s:"收获延迟，创造力被压抑，过度依赖。",l:"感情中的不平等。",c:"付出多回报少。",f:"冲动消费需控制。"}},

         r:{s:"挑战传统，被陈旧观念束缚。",l:"不按常理出牌。",c:"创新受阻于旧制。",f:"打破常规可能有新机。"}},
        {n:"恋人",en:"The Lovers",e:"风",kw:["爱情","选择","和谐","结合"],
         u:{s:"命中注定的缘分，重要的选择摆在你面前。",l:"灵魂契合的美满爱情。",c:"合伙创业良机。",f:"合作带来财富。"},
         r:{s:"感情破裂，错误选择，价值观冲突。",l:"三角关系危机。",c:"合伙关系破裂。",f:"因情感不理智决策。"}},
        {n:"战车",en:"The Chariot",e:"水",kw:["胜利","动力","决心","控制"],
         u:{s:"克服困难，凭借坚强意志力达成目标。",l:"主动追求终成功。",c:"事业突飞猛进。",f:"积极主动出击。"},
         r:{s:"失控失败，方向错误，被情绪主导。",l:"争吵激烈。",c:"竞争失利。",f:"投资失利需止损。"}},
        {n:"力量",en:"Strength",e:"火",kw:["勇气","耐心","温柔","信心"],
         u:{s:"以柔克刚，用爱与耐心驯服内心的野兽。",l:"温柔的力量让感情更深。",c:"从容应对挑战。",f:"稳健不受短期波动影响。"},

         u:{s:"公平公正的结果，为自己的行为负责。",l:"平等诚实的关系。",c:"付出得到应有回报。",f:"财务平衡合理分配。"},
         r:{s:"不公待遇，逃避责任，偏见影响判断。",l:"不平等关系需审视。",c:"遭遇不公需力争。",f:"财务纠纷需查合同。"}},
        {n:"倒吊人",en:"The Hanged Man",e:"水",kw:["牺牲","等待","换位","放下"],
         u:{s:"换个角度看世界，暂时的停顿是为了更好的出发。",l:"为爱付出等待但别失自我。",c:"暂时停滞适反思。",f:"牺牲短期换长远。"},

        {n:"死神",en:"Death",e:"水",kw:["结束","转变","重生","新生"],
         u:{s:"旧的篇章结束，全新的开始即将来临，不要害怕改变。",l:"旧情结束或进入新阶段。",c:"职业生涯转变。",f:"旧模式终结新机出现。"},
         r:{s:"抗拒改变，停滞不前，拖着不放。",l:"不愿放手已结束的感情。",c:"死守无前途工作。",f:"坚持错误投资。"}},

    function buildAllCards() {
        const deck = [];
        // Major Arcana
        MAJOR.forEach((c,i) => {
            const num = String(i).padStart(2,'0');
            deck.push({
                id:i, type:"major", name_zh:c.n, name_en:c.en, suit:null, suit_zh:null,
                element:c.e, keywords:c.kw,
                upright:{summary:c.u.s, love:c.u.l, career:c.u.c, fortune:c.u.f},
                reversed:{summary:c.r.s, love:c.r.l, career:c.r.c, fortune:c.r.f},
                img: picUrl('ar'+num)
            });
        });
        // Minor Arcana
        let cid = 22;
        const suitCodes = {wands:'w', cups:'c', swords:'s', pentacles:'p'};
        const rankCodes = {ace:'ac', two:'02', three:'03', four:'04', five:'05', six:'06',
            seven:'07', eight:'08', nine:'09', ten:'10', page:'pa', knight:'kn', queen:'qu', king:'ki'};
        for (const [sk, si] of Object.entries(MINOR_SUITS)) {
            for (const rk of MINOR_RANKS) {
                const m = MINOR_MEANINGS[sk][rk];
                const rzh = RANK_ZH[rk];
                const expanded = expandMinorMeaning(m, sk);
                deck.push({
                    id:cid++, type:"minor", name_zh:`${si.zh}${rzh}`, name_en:`${rk[0].toUpperCase()+rk.slice(1)} of ${sk[0].toUpperCase()+sk.slice(1)}`,
                    suit:sk, suit_zh:si.zh, element:si.e, keywords:[],
                    upright:expanded.u, reversed:expanded.r,
                    img: picUrl(suitCodes[sk] + rankCodes[rk])
                });
            }
        }
        return deck;
    }

    function picUrl(code) {
        // 百年韦特塔罗牌 — 公共领域图片源
        return `https://www.sacred-texts.com/tarot/pics/${code}.jpg`;
    }

    function expandMinorMeaning(m, suit) {
        // 根据花色为感情/事业/财运生成差异化解读
        const domains = {
            wands: {love:'感情上需要主动表达热情，但注意不要过于强势。', career:'事业上充满行动力和创造力，是开拓进取的好时机。', fortune:'财务上适合积极投资，但需控制风险。'},
            cups:   {love:'感情上情感流动丰富，适合表达真心和建立深层连接。', career:'事业上适合团队合作和创意工作，信任直觉。', fortune:'财务上避免情绪化消费，感性之余也需理性规划。'},
            swords: {love:'感情上需要清晰的沟通，避免误会和冷战。', career:'事业上需要理性决策和战略思维，勇敢面对挑战。', fortune:'财务上需精打细算，避免冲动投资和过度消费。'},
            pentacles:{love:'感情上需要稳定和安全感，用行动而非言语表达爱。', career:'事业上脚踏实地，积累经验和资源，厚积薄发。', fortune:'财务上稳健增长，适合长期投资和储蓄计划。'}
        };
        const d = domains[suit] || domains.wands;
        const um = m.u, rm = m.r;
        return {
            u: {summary:um, love:um + ' ' + d.love, career:um + ' ' + d.career, fortune:um + ' ' + d.fortune},
            r: {summary:rm, love:rm + ' ' + d.love, career:rm + ' ' + d.career, fortune:rm + ' ' + d.fortune}
        };
    }

    const ALL_CARDS = buildAllCards();

    const SPREADS = {
        single:{name:"单张牌占卜", desc:"抽出1张牌，快速获得今日指引", count:1, pos:["今日指引"]},

    // ==================== 初始化 ====================
    function init() {
        let html = '';
        for (const [k,s] of Object.entries(SPREADS)) {
            html += `<div class="spread-option${k==='three'?' selected':''}" data-spread="${k}" onclick="selectSpread('${k}',this)">
                <span style="float:right;font-size:11px;color:var(--purple-light);">${s.count}张</span>
                <div class="spread-name">${s.name}</div><div class="spread-desc">${s.desc}</div></div>`;
        }
        document.getElementById('spreadOptions').innerHTML = html;
        checkMode();
    }

    async function checkMode() {
        const el = document.getElementById('modeIndicator');
        try {
            const r = await fetch(`${API_BASE}/api/spreads`, {signal: AbortSignal.timeout(3000)});
            if (r.ok) { el.innerHTML = '<span style="color:#00d4aa;">🤖 在线模式 — AI 增强就绪</span>'; return; }
        } catch(e) {}
        el.innerHTML = '<span style="color:#d4a843;">📖 离线模式 — 经典解读</span>';
    }

    function selectSpread(type, el) {
        document.querySelectorAll('.spread-option').forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected'); state.spreadType = type;
    }

    // ==================== 抽牌 ====================
    function startReading() {
        state.question = document.getElementById('questionInput').value.trim();
        state.drawnCards = []; state.drawnCount = 0; state.readingResult = null; state.aiPowered = false;
        const s = SPREADS[state.spreadType]; state.totalCards = s.count;
        switchStep('stepDraw');
        const grid = document.getElementById('cardsGrid');
        document.getElementById('drawInstruction').textContent = `🃏 请抽取 ${s.count} 张塔罗牌`;
        document.getElementById('drawActions').style.display = 'none';
        grid.innerHTML = Array.from({length:s.count}, (_,i) => `
            <div class="tarot-card" id="drawCard${i}" onclick="drawCard(${i})">
                <div class="card-face card-back"><div class="card-back-inner">
                    <div class="star-icon">✦</div><div class="moon-text">TAROT</div></div></div>
                <div class="card-face card-front"></div>
            </div>`).join('');
    }

    function drawCard(index) {
        if (index !== state.drawnCards.length) return;
        const card = ALL_CARDS[Math.floor(Math.random() * 78)];
        const isRev = Math.random() < 0.3;
        const cardData = {
            ...card, is_reversed: isRev,
            interpretation: card[isRev?'reversed':'upright']
        };
        state.drawnCards.push(cardData); state.drawnCount++;

        const el = document.getElementById(`drawCard${index}`);
        el.classList.add('flipped');
        const front = el.querySelector('.card-front');
        front.className = `card-face card-front ${isRev?'reversed-card':''}`;
        front.innerHTML = `
            <img src="${cardData.img||''}" alt="${cardData.name_zh}" onerror="this.style.display='none'" loading="lazy">
            <div class="card-overlay">
                ${isRev?'<div class="reversed-badge">逆位</div>':''}
                <div class="card-type-badge">${cardData.type==='major'?'大阿卡纳':cardData.suit_zh||''}</div>
                <div class="card-name">${cardData.name_zh}</div>
                <div class="card-element">${cardData.element||''}</div>
                <div class="card-keywords">${(cardData.keywords||[]).slice(0,4).join(' · ')}</div>
                <div class="card-position-label">第${index+1}张</div>
            </div>`;

        const remaining = state.totalCards - state.drawnCount;
        if (remaining > 0) {
            document.getElementById('drawInstruction').textContent = `✨ 还有 ${remaining} 张牌等待你的选择`;
        } else {
            document.getElementById('drawInstruction').textContent = '🌟 所有牌已抽完！';
            document.getElementById('drawActions').style.display = 'flex';
        }
    }

    function revealAll() {
        while (state.drawnCount < state.totalCards) drawCard(state.drawnCount);
    }

    // ==================== 获取解读 ====================
    let readingInProgress = false;

    async function getReading() {
        if (readingInProgress) return; // 防止重复点击
        if (state.drawnCount < state.totalCards) revealAll();

        readingInProgress = true;
        document.getElementById('drawInstruction').textContent = '🔮 正在为你深度解读中...';

        // 构建基础结果（使用用户已抽的牌，不会被替换）
        let result = buildLocalReading();
        state.readingResult = result;
        switchStep('stepResult'); renderResult(); // 先展示结果

        // 尝试调用后端 AI 获取增强解读
        const key = localStorage.getItem('deepseek_api_key') || '';
        try {
            const r = await fetch(`${API_BASE}/api/reading`, {
                method:'POST', headers:{'Content-Type':'application/json','X-API-Key':key},
                body:JSON.stringify({
                    spread_type: state.spreadType,
                    question: state.question,
                    // 发送用户已抽的牌 ID，确保后端使用相同牌
                    card_ids: state.drawnCards.map(c => c.id || c.card_id)
                }),
                signal: AbortSignal.timeout(15000)
            });
            if (r.ok) {
                const aiResult = await r.json();
                if (aiResult.ai_powered && aiResult.overall_reading) {
                    // 只使用 AI 的综合解读，保留用户抽的牌
                    result.overall_reading = aiResult.overall_reading;
                    result.ai_powered = true;
                    state.aiPowered = true;
                    renderResult(); // 刷新显示 AI 增强内容
                }
            }
        } catch(e) { console.log('API不可用，使用本地解读'); }

        readingInProgress = false;
    }

    function buildLocalReading() {
        const s = SPREADS[state.spreadType];
        const cards = state.drawnCards.map((c,i) => ({
            ...c, position: s.pos[i]||`第${i+1}张`, position_index: i
        }));

        // === 逐牌解读 ===
        let text = `📜 **${s.name}**\n`;
        if (state.question) text += `🎴 问题：「${state.question}」\n`;
        text += '\n---\n## 📜 各牌位详细解读\n';

        for (const c of cards) {
            const d = c.is_reversed ? '逆位 ⚠️' : '正位 ✨';
            const interp = c.interpretation;
            const posContext = getPositionContext(c.position, c, cards);
            text += `\n### [${c.position}] ${c.name_zh} — ${d}\n`;
            text += `**${interp.summary || interp.s || ''}**\n`;
            if (posContext) text += `*${posContext}*\n`;
            for (const [k,em] of [['love','💕 感情'],['career','💼 事业'],['fortune','💰 财运']]) {
                if (interp[k]) text += `- ${em}：${interp[k]}\n`;
            }
        }

        // === 元素分析 ===
        const elements = {};
        for (const c of cards) {
            const el = c.element || '未知';
            elements[el] = (elements[el]||0) + 1;
        }
        text += '\n---\n## 🌿 元素能量分析\n';
        for (const [el,count] of Object.entries(elements)) {
            const percentage = Math.round(count/cards.length*100);
            const bar = '█'.repeat(Math.round(percentage/10)) + '░'.repeat(10-Math.round(percentage/10));
            text += `- **${el}元素**：${bar} ${percentage}%\n`;
        }
        const dominantEl = Object.entries(elements).sort((a,b)=>b[1]-a[1])[0];
        const elDesc = {
            '火': '火元素旺盛，行动力与激情充沛。适合主动出击、开创事业。但需避免冲动和急躁。',
            '水': '水元素主导，情感与直觉敏锐。适合处理人际关系、创作和心灵探索。但需避免情绪化。',
            '风': '风元素强劲，思维清晰敏捷。适合学习、沟通和决策。但需避免空想和犹豫不决。',
            '土': '土元素稳固，务实可靠。适合理财、规划和长期建设。但需避免固执和保守。'
        };
        if (elDesc[dominantEl[0]]) text += `\n${elDesc[dominantEl[0]]}\n`;

        // === 牌面联动 ===
        text += '\n---\n## 🔗 牌面联动分析\n';
        const majorCards = cards.filter(c=>c.type==='major');
        const minorCards = cards.filter(c=>c.type==='minor');
        const reversedCards = cards.filter(c=>c.is_reversed);

        // 大牌联动
        if (majorCards.length >= 2) {
            text += '\n**🏛 大阿卡纳联动：**\n';
            text += `牌阵中出现 ${majorCards.length} 张大阿卡纳（${majorCards.map(c=>c.name_zh).join('、')}），`;
            text += '这些原型能量互相交织，表明当前的课题具有深远的人生意义。';
            if (majorCards.some(c=>['死神','高塔'].includes(c.name_zh))) {
                text += '\n⚠️ 其中出现了重大转变牌（死神/高塔），预示着深刻的人生转折，旧的模式必须瓦解才能迎来新生。';
            }
            if (majorCards.some(c=>['太阳','星星','世界'].includes(c.name_zh))) {
                text += '\n✨ 同时出现积极结果牌（太阳/星星/世界），无论当前多么困难，美好的结局正在等待着你。';
            }
            text += '\n';
        }

        // 同花色联动
        const suitGroups = {};
        for (const c of minorCards) {
            if (c.suit) {
                if (!suitGroups[c.suit]) suitGroups[c.suit] = [];
                suitGroups[c.suit].push(c);
            }
        }
        for (const [suit, scards] of Object.entries(suitGroups)) {
            if (scards.length >= 2) {
                const suitName = scards[0].suit_zh;
                const suitDomain = {wands:'行动与事业', cups:'情感与关系', swords:'思想与决策', pentacles:'财富与物质'};
                text += `\n**${'🪄🔮⚔️🪙'[{wands:0,cups:1,swords:2,pentacles:3}[suit]]} ${suitName}牌组集中：**`;
                text += `多张${suitName}牌出现，说明${suitDomain[suit]||''}是当前的核心主题，需要重点关注。\n`;
            }
        }

        // 矛盾/互补分析
        if (cards.length >= 2) {
            const first = cards[0], last = cards[cards.length-1];
            if (first.is_reversed !== last.is_reversed) {
                text += '\n**🔄 牌阵走向：**';
                if (!first.is_reversed && last.is_reversed) {
                    text += '牌阵从正位走向逆位，提示当前的正向能量可能遇到阻碍，需要在后期格外注意调整心态和策略。\n';
                } else {
                    text += '牌阵从逆位走向正位，这是一个由阴转阳的过程，初期的困难和阻碍将在后期逐渐化解。\n';
                }
            }
        }

        // === 🔮 核心：根据问题生成整体解读答案 ===
        text += '\n---\n## 🔮 整体解读\n\n';
        const question = state.question || '';
        const mc = majorCards.length;
        const rc = reversedCards.length;

        // 1. 问题相关域识别
        const domain = detectDomain(question);

        // 2. 生成叙事性综合答案
        text += generateNarrativeAnswer(question, cards, domain, s);

        // 3. 能量走向分析
        text += '\n### 📈 能量走向\n';
        text += analyzeEnergyFlow(cards);
        text += '\n';

        // 4. 正逆位综合判断
        text += '\n### ⚖️ 总体判断\n';
        if (rc === 0) {
            text += '牌阵全部正位——✨ **大吉之兆**。所有能量都处于最佳流动状态，这是一个极为难得的时机，命运的齿轮正向你倾斜。大胆前行，宇宙在支持你。\n';
        } else if (rc <= Math.floor(cards.length * 0.3)) {
            text += '牌阵以正位为主，整体能量偏向积极。少量逆位牌的出现是在提醒你注意细节和内在功课，它们是指向成长的温柔提醒。\n';
        } else if (rc <= Math.floor(cards.length * 0.5)) {
            text += '正逆位交错，能量处于动态平衡中。这反映了你内心的拉扯——既有前进的动力，也有需要放下的包袱。当下的关键是找到平衡点。\n';
        } else {
            text += '多张逆位牌出现，能量看似受阻，但请理解：逆位不是惩罚，而是宇宙在告诉你"换一个角度"。最深层的成长往往来自逆位牌的启示。\n';
        }

        // 5. 可执行建议
        text += '\n### 💫 给你的具体建议\n';
        text += generateActionableAdvice(question, cards, domain);

        text += '\n---\n> 🌙 塔罗是你潜意识的镜子，以上解读是你内心智慧的映射。最终的选择权与力量永远在你手中。';

        return {
            reading_id:'local-'+Date.now(), spread_name:s.name, spread_description:s.desc,
            question:state.question, cards, overall_reading:text,
            ai_powered:false, created_at:new Date().toISOString()
        };
    }

    function getPositionContext(pos, card, allCards) {
        // 根据牌位位置给出语境化注释
        const contexts = {
            '过去': '这张牌揭示了过去影响当前局面的因素。它可能代表已经发生的事、你过去的某个选择，或是你从过去带来的经验模式。',
            '现在': '这张牌照见了你当下的核心状态和面临的直接课题。聚焦于此，这是你需要觉察和处理的。',
            '未来': '这张牌指向可能的趋势和发展方向。请记住，未来是流动的，你可以通过当下的选择来改变它。',
            '核心问题': '这是整个牌阵的核心，是你此刻最需要面对的灵魂课题。',
            '阻碍或助力': '这张牌代表横跨核心问题的能量——可能是阻力，也可能转化为助力。',
            '基础': '这张牌揭示了问题的深层根源和地基，是你需要了解的根本。',
            '过去影响': '过往的经历如何塑造了你当前的处境和心态。',
            '可能结果': '如果按照当前趋势发展，可能出现的走向。',
            '近未来': '短期内即将显现的能量和事件。',
            '你的态度': '你对此事的内在心态、信念和应对方式。',
            '外界环境': '外部世界如何看待你、如何影响你的处境。',
            '希望与恐惧': '你的深层渴望和深层不安同时存在于这张牌中。',
            '最终结果': '综合所有因素后呈现的最终趋势和结果。',
        };
        if (contexts[pos]) return contexts[pos];

        // 根据位置序号智能生成
        const idx = card.position_index;
        if (idx === 0) return '牌阵的起点，奠定整个解读的基调。';
        if (idx === allCards.length - 1) return '牌阵的终点，揭示整个能量流动的归宿。';
        return null;
    }

    function detectDomain(question) {
        // 识别用户问题的核心领域
        const q = question.toLowerCase();
        if (/感情|恋爱|爱情|婚姻|分手|复合|对象|伴侣/.test(q)) return 'love';
        if (/事业|工作|职业|职场|跳槽|升职|创业/.test(q)) return 'career';
        if (/财运|钱|投资|理财|收入|负债|经济/.test(q)) return 'wealth';
        if (/学业|考试|学习|成绩|考研|高考/.test(q)) return 'study';
        if (/健康|身体|疾病/.test(q)) return 'health';
        return 'general';
    }

    function generateNarrativeAnswer(question, cards, domain, spread) {
        let narrative = '';

        // 开场：直接回应问题
        if (question) {
            narrative += `针对你提出的问题「**${question}**」，牌阵给出了以下回应：\n\n`;
        }

        // 按牌位顺序串联故事情节
        const story = [];
        for (const c of cards) {
            const posName = c.position;
            const cardName = c.name_zh;
            const dir = c.is_reversed ? '逆位' : '正位';
            const meaning = c.interpretation.summary || c.interpretation.s || '';
            story.push({ posName, cardName, dir, meaning, isReversed: c.is_reversed, type: c.type, element: c.element, suit: c.suit, keywords: c.keywords });
        }

        // 合成故事性叙述
        narrative += '> ';
        if (spread.name.includes('三张') || spread.name.includes('过去')) {
            // 过去-现在-未来 时间线叙事
            const past = story.find(s => s.posName.includes('过去'));
            const now = story.find(s => s.posName.includes('现在') || s.posName.includes('当前'));
            const future = story.find(s => s.posName.includes('未来') || s.posName.includes('结果'));
            if (past && now && future) {
                narrative += `从时间线来看，${past.posName}的「${past.cardName}」(${past.dir})揭示了${past.meaning.slice(0, 40)}... `;
                narrative += `到了${now.posName}，「${now.cardName}」(${now.dir})表明${now.meaning.slice(0, 40)}... `;
                narrative += `展望${future.posName}，「${future.cardName}」(${future.dir})预示着${future.meaning.slice(0, 40)}... `;
                narrative += '\n\n';
                // 判断整体趋势
                const allPositive = !past.isReversed && !now.isReversed && !future.isReversed;
                const allNegative = past.isReversed && now.isReversed && future.isReversed;
                const improving = past.isReversed && !future.isReversed;
                const declining = !past.isReversed && future.isReversed;
                if (allPositive) narrative += '✨ **整体判断：能量持续向好！**从过去到现在到未来，能量始终积极正向，这是一个值得期待的发展周期。\n';
                else if (allNegative) narrative += '⚠️ **整体判断：当前处于调整期。**三个时间点均以逆位呈现，提示你需要全面反思和内在调整。但这意味着——转机即将到来。\n';
                else if (improving) narrative += '🌅 **整体判断：正在走出低谷。**过去虽有困难，但现在是转折点，未来的能量正在向好转变。坚持下去！\n';
                else if (declining) narrative += '🔔 **整体判断：需要警惕。**过去较为顺遂，但如果不注意调整，未来可能出现挑战。现在是改变的关键时机。\n';
            } else {
                narrative += buildGenericNarrative(story);
            }
        } else {
            narrative += buildGenericNarrative(story);
        }

        // 领域专项分析
        narrative += '\n### 🎯 针对你的问题领域\n';
        if (domain === 'love') {
            const loveCards = cards.filter(c => c.name_zh.includes('恋人') || c.name_zh.includes('圣杯') || c.name_zh.includes('皇后') || c.name_zh.includes('皇帝'));
            if (loveCards.length > 0) {
                narrative += `牌阵中出现了与感情密切相关的牌（${loveCards.map(c=>c.name_zh).join('、')}），`;
                const hasLovers = loveCards.some(c => c.name_zh === '恋人');
                const hasCups = loveCards.some(c => c.suit === 'cups');
                if (hasLovers && hasCups) narrative += '这是非常强烈的感情指引信号。恋人牌与圣杯牌的共振表明，你当前的感情课题是灵魂层面的重要功课。真诚沟通与心灵契合是关键。\n';
                else if (hasLovers) narrative += '恋人牌的出现提示你面临重要的感情选择。请用心灵而非头脑来做决定。\n';
                else narrative += '圣杯牌组的能量提示你多关注自己的情感需求和直觉感受。\n';
            } else {
                narrative += '牌阵未直接出现感情牌，但综合所有牌的能量，建议你先专注于自我成长——最好的爱情，往往在你成为最好的自己时不期而至。\n';
            }
        } else if (domain === 'career') {
            const careerCards = cards.filter(c => c.name_zh.includes('权杖') || c.name_zh.includes('星币') || c.name_zh.includes('战车') || c.name_zh.includes('皇帝') || c.name_zh.includes('魔术师'));
            if (careerCards.length > 0) {
                narrative += `牌阵中事业相关牌出现${careerCards.length}张（${careerCards.map(c=>c.name_zh).join('、')}）。`;
                // 综合分析
                const hasAction = careerCards.some(c => c.suit === 'wands' || c.name_zh === '战车');
                const hasStable = careerCards.some(c => c.suit === 'pentacles' || c.name_zh === '皇帝');
                if (hasAction && hasStable) narrative += '行动力与稳定性兼具——这是事业发展的黄金组合。有权杖的冲劲，也有星币的稳健，把握好节奏方能持久。\n';
                else if (hasAction) narrative += '行动力充沛但稳定性不足。建议在冲刺的同时不要忽视打基础。\n';
                else narrative += '基础扎实但需要更多主动出击。适当走出舒适区会有意想不到的收获。\n';
            } else {
                narrative += '牌阵未直接出现事业牌，但每张牌都能映射到职场智慧。建议从牌面关键词中找到对工作最有启发的那一句，作为本周的行动指南。\n';
            }
        } else if (domain === 'wealth') {
            const wealthCards = cards.filter(c => c.suit === 'pentacles' || c.name_zh.includes('星币'));
            if (wealthCards.length > 0) {
                narrative += `牌阵中出现${wealthCards.length}张星币牌，财务相关能量极强。`;
                const allUpright = wealthCards.every(c => !c.is_reversed);
                if (allUpright) narrative += '所有财务牌均为正位，财富能量流动顺畅。现在正是规划长远财务的好时机。\n';
                else narrative += '部分财务牌处于逆位，提示需要审视消费习惯和投资策略，避免不理智的财务决策。\n';
            } else {
                narrative += '牌阵未直接出现财务牌。建议这段时间先做好财务基本功——记账、储蓄、减少不必要开支。财务自由从自律开始。\n';
            }
        } else {
            // 通用领域
            narrative += '牌阵从多个维度为你揭示了当下的能量状态。请仔细阅读每张牌的指引，你内心最被触动的那条信息，就是你此刻最需要的答案。\n';
        }

        return narrative;
    }

    function buildGenericNarrative(story) {
        // 通用叙事：按牌位顺序串联
        let text = '';
        const len = story.length;
        for (let i = 0; i < len; i++) {
            const s = story[i];
            if (i === 0) text += `牌阵的起点「${s.posName}」位置上，「${s.cardName}」(${s.dir})奠定了整个解读的基调：${s.meaning.slice(0, 60)}。`;
            else if (i === len - 1) text += ` 最终「${s.posName}」位置的「${s.cardName}」(${s.dir})揭示了事件的归宿：${s.meaning.slice(0, 60)}。`;
            else text += ` 在「${s.posName}」位置，「${s.cardName}」(${s.dir})作为关键枢纽，连接了前后能量的流动。`;
        }
        return text + '\n\n';
    }

    function analyzeEnergyFlow(cards) {
        const first = cards[0], last = cards[cards.length - 1];
        const firstGood = !first.is_reversed;
        const lastGood = !last.is_reversed;

        if (firstGood && lastGood) {
            return '从牌阵起点到终点，能量保持正向流动。整个过程处于积极、顺畅的状态。你只需保持当前的节奏，顺势而为即可。';
        } else if (!firstGood && lastGood) {
            return '从起点的不确定或挑战，到终点的明朗与积极——这是一个**渐入佳境**的过程。初期的困难是成长的催化剂，最终的收获会证明一切等待都值得。';
        } else if (firstGood && !lastGood) {
            return '起点虽好，终点却有警示。这不是坏消息，而是珍贵的提醒——如果继续当前的模式，可能会遇到阻碍。**现在是调整航向的最佳时机**。';
        } else {
            return '全程能量处于挑战期。但这往往是成长最快的阶段——逆位牌教给我们的，往往比正位牌更多。请把这段时间视为灵魂的修炼期。';
        }
    }

    function generateActionableAdvice(question, cards, domain) {
        let advice = '';

        // 基于问题给出具体建议
        if (domain === 'love') {
            advice += '- 💕 本周至少对伴侣（或心仪对象）真诚表达一次感受，用"我"语句而非"你"语句沟通\n';
            advice += '- 🌙 独处时问自己：这段关系中我最需要的是什么？我有哪些恐惧需要放下？\n';
        } else if (domain === 'career') {
            advice += '- 💼 本周列出三个可量化的职业小目标，哪怕只是整理简历或学习一个新技能\n';
            advice += '- 📋 主动约一位值得信任的前辈/导师喝咖啡，听听他们对你的职业建议\n';
        } else if (domain === 'wealth') {
            advice += '- 💰 本周认真审视一次你的收支状况，找出三个可以优化的开支项目\n';
            advice += '- 📊 花30分钟学习一个基础理财概念（复利、基金定投、资产配置）\n';
        } else {
            advice += '- 📝 写下牌阵中最触动你的那张牌，把它作为这周的"守护牌"，每天看一眼\n';
            advice += '- 🧘 每天花5分钟静坐，观察自己的思绪而不评判，答案往往在安静中出现\n';
        }

        // 基于牌面给额外建议
        const hasTower = cards.some(c => c.name_zh === '高塔');
        const hasDeath = cards.some(c => c.name_zh === '死神');
        const hasSun = cards.some(c => c.name_zh === '太阳');
        const hasStar = cards.some(c => c.name_zh === '星星');

        if (hasTower || hasDeath) {
            advice += '- 🔥 牌面提示重大转变在即。请勇敢放手那些不再服务于你的人事物——旧的离开才能为新的腾出空间\n';
        }
        if (hasSun || hasStar) {
            advice += '- ✨ 希望之光已在牌阵中闪耀。即使暂时看不到出路，也请相信好事正在来的路上。保持积极期待\n';
        }
        advice += '- 🌟 选一张最有共鸣的牌，让它成为你本周的精神图腾。每天早上看它一眼，感受它传递的能量\n';

        return advice;
    }

    // ==================== 渲染结果 ====================
    function renderResult() {
        const r = state.readingResult;
        document.getElementById('resultTitle').innerHTML = r.spread_name +
            (r.ai_powered ? ' <span class="ai-badge">🤖 AI增强</span>' : '');
        document.getElementById('resultInfo').textContent = r.question ? '问：「' + r.question + '」' : r.spread_description;

        document.getElementById('resultCards').innerHTML = r.cards.map((c,i) => `
            <div class="result-mini-card played" style="cursor:pointer" onclick="document.getElementById('cardInterp${i}').scrollIntoView({behavior:'smooth',block:'center'})">
                <div class="mini-inner">
                    <div class="mini-face mini-back"><span>✦</span></div>
                    <div class="mini-face mini-front" style="padding:0;overflow:hidden;">
                        <img src="${c.img||''}" alt="${c.name_zh}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:6px;" onerror="this.style.display='none'" loading="lazy">
                        <div style="position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px;background:rgba(245,240,232,0.8);width:100%;height:100%;box-sizing:border-box;">
                            <div class="mini-name">${c.name_zh}</div>
                            <div class="mini-pos">${c.position}</div>
                            <div style="font-size:7px;color:${c.is_reversed?'#c0392b':'#4a9'};margin-top:1px;">${c.is_reversed?'逆位':'正位'}</div>
                        </div>
                    </div>
                </div>
            </div>`).join('');

        let html = '<h3>📜 牌阵解读</h3>';
        r.cards.forEach((c,i) => {
            const interp = c.interpretation || {};
            html += `<div class="card-interp" id="cardInterp${i}">
                <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;">
                    <div style="width:90px;height:140px;flex-shrink:0;border-radius:8px;overflow:hidden;border:2px solid #8b6914;background:linear-gradient(135deg,#1a1040,#2d1050);">
                        <img src="${c.img||''}" alt="${c.name_zh}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.style.display='none'" loading="lazy">
                    </div>
                    <div style="flex:1;min-width:180px;">
                        <div class="card-interp-header">
                            <span class="card-title">${c.name_zh}</span>
                            <span class="pos-tag">${c.position}</span>
                            ${c.is_reversed?'<span class="rev-tag">逆位 ⚠️</span>':'<span style="color:#d4a843;font-size:11px;">正位 ✨</span>'}
                        </div>
                        <div class="card-interp-summary">${interp.summary||interp.s||'请参考综合解读'}</div>
                        <div class="interp-grid">
                            ${interp.love?`<div class="interp-item"><strong>💕 感情</strong><br>${interp.love}</div>`:''}
                            ${interp.career?`<div class="interp-item"><strong>💼 事业</strong><br>${interp.career}</div>`:''}
                            ${interp.fortune?`<div class="interp-item"><strong>💰 财运</strong><br>${interp.fortune}</div>`:''}
                        </div>
                    </div>
                </div>
            </div>`;
        });
        html += `<div class="overall-reading">${simpleMd(r.overall_reading)}</div>`;
        document.getElementById('readingDetail').innerHTML = html;
    }

    function simpleMd(t) {
        if (!t) return '';
        return t.replace(/### (.*)/g,'<h4 style="color:#d4a843;margin:10px 0;">$1</h4>')
            .replace(/## (.*)/g,'<h3 style="color:#f0d68a;font-size:18px;">$1</h3>')
            .replace(/\*\*(.*?)\*\*/g,'<strong style="color:#f0d68a;">$1</strong>')
            .replace(/\n\n/g,'<br><br>').replace(/\n- /g,'<br>- ')
            .replace(/\n/g,'<br>').replace(/> (.*)/g,'<em style="color:#8a80a0;">$1</em>');
    }

    function shareReading() {
        const r = state.readingResult;
        let t = `🔮 ${r.spread_name}\n` + (r.question?`问：「${r.question}」\n`:'');
        r.cards.forEach(c => {
            t += `\n[${c.position}] ${c.name_zh} — ${c.is_reversed?'逆位':'正位'}\n${c.interpretation.summary||''}\n`;
        });
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(()=>showToast('✅ 已复制到剪贴板'));
    }

    function switchStep(id) {
        document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
        document.getElementById(id).classList.add('active'); scrollTo({top:0,behavior:'smooth'});
    }

    function resetApp() {
        state.drawnCards=[]; state.drawnCount=0; state.readingResult=null; state.aiPowered=false;
        document.getElementById('questionInput').value='';
        switchStep('stepConfig'); checkMode();
    }

    function showToast(msg) {
        const t = document.createElement('div');
        Object.assign(t.style,{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',
            background:'rgba(20,15,50,0.95)',color:'#f0d68a',padding:'10px 24px',borderRadius:'20px',
            zIndex:'999',border:'1px solid #d4a843',letterSpacing:'2px',fontSize:'14px'});
        t.textContent=msg; document.body.appendChild(t);
        setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .5s';setTimeout(()=>t.remove(),500);},1800);
    }

    init();
    </script>
</body>
</html>
